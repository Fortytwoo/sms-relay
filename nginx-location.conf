location = /sms-relay {
    return 301 /sms-relay/;
}

# OAuth callback queries contain a short-lived authorization code and state.
# Keep them out of the default access log while preserving the same proxy path.
location = /sms-relay/auth/callback {
    access_log off;
    proxy_pass http://127.0.0.1:8000/auth/callback$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    client_max_body_size 64k;
}

location ^~ /sms-relay/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    client_max_body_size 64k;
}
