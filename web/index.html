<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>短信中转</title>
  <link rel="stylesheet" href="assets/app.css?v=1.0.0">
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <div class="brand">短信中转</div>
      <div class="topbar-actions" id="topbar-actions" hidden>
        <span class="signed-in-user" id="signed-in-user"></span>
        <div class="service-state" id="service-state" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="service-state-text">服务正常</span>
        </div>
        <span class="topbar-separator" aria-hidden="true"></span>
        <button class="text-button" id="logout-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 5H6.8A1.8 1.8 0 0 0 5 6.8v10.4A1.8 1.8 0 0 0 6.8 19H10M14.5 8l4 4-4 4M9 12h9"></path></svg>
          <span>退出登录</span>
        </button>
      </div>
    </header>

    <main class="login-view" id="login-view">
      <section class="login-card" aria-labelledby="login-title">
        <div class="lock-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="5.5" y="10" width="13" height="10" rx="2"></rect><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3M12 14v2"></path></svg>
        </div>
        <h1 id="login-title">安全访问</h1>
        <p class="login-subtitle">使用飞书账号完成身份认证后查看转发短信</p>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button class="primary-button feishu-login-button" id="feishu-login" type="button">
          <span class="feishu-mark" aria-hidden="true">飞</span>
          <span>飞书账号登录</span>
          <span class="button-spinner" aria-hidden="true"></span>
        </button>
        <div class="session-note">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2.8 19 5.7v5.2c0 4.5-2.9 8.5-7 10.3-4.1-1.8-7-5.8-7-10.3V5.7l7-2.9Z"></path><path d="m9 12 2 2 4-4"></path></svg>
          仅允许服务端白名单中的飞书账号访问
        </div>
      </section>
    </main>

    <main class="inbox-view" id="inbox-view" hidden>
      <section class="inbox-panel" aria-labelledby="inbox-title">
        <div class="panel-heading">
          <h1 id="inbox-title">收件箱</h1>
        </div>
        <div class="inbox-controls">
          <label class="search-box" for="search-input">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
            <input id="search-input" type="search" placeholder="搜索号码或内容" autocomplete="off">
          </label>
          <div class="control-row">
            <button class="secondary-button" id="refresh-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"></path><path d="M6.1 9a7 7 0 0 1 11.5-2L20 9M4 15l2.4 2a7 7 0 0 0 11.5-2"></path></svg>
              刷新
            </button>
            <label class="switch-control">
              <span>自动刷新</span>
              <input id="auto-refresh" type="checkbox" checked>
              <span class="switch" aria-hidden="true"></span>
            </label>
          </div>
        </div>
        <div class="message-list" id="message-list" role="listbox" aria-label="短信列表" aria-live="polite"></div>
        <div class="list-empty" id="list-empty" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5h16v11H8l-4 3v-14Z"></path></svg>
          <strong>暂无短信</strong>
          <span>收到新短信后会自动出现在这里</span>
        </div>
        <button class="load-more" id="load-more" type="button" hidden>加载更多</button>
        <div class="list-footer" id="list-footer">共 0 条</div>
      </section>

      <section class="detail-panel" aria-labelledby="detail-title">
        <div class="mobile-detail-bar">
          <button class="back-button" id="back-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
            返回
          </button>
          <strong>短信详情</strong>
          <span aria-hidden="true"></span>
        </div>
        <div class="panel-heading desktop-detail-heading">
          <h2 id="detail-title">短信详情</h2>
        </div>
        <div class="detail-empty" id="detail-empty">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16v12H4V7Z"></path><path d="m4 8 8 6 8-6"></path></svg>
          <strong>暂无短信</strong>
          <span>收到新短信后会自动出现在这里</span>
        </div>
        <article class="detail-card" id="detail-card" hidden>
          <div class="detail-row sender-row">
            <div class="detail-label">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2"></path></svg>
              <span>来源号码</span>
            </div>
            <div class="detail-value detail-sender-value">
              <span id="detail-sender"></span>
              <button class="copy-button" id="copy-sender" type="button" aria-label="复制来源号码" title="复制来源号码">
                <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="10" height="10" rx="1.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
              </button>
            </div>
          </div>
          <div class="detail-row content-row">
            <div class="detail-label">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3V5Z"></path><path d="M8 9h8M8 13h5"></path></svg>
              <span>短信内容</span>
            </div>
            <p class="message-content" id="detail-content"></p>
          </div>
          <div class="detail-row" id="verification-row" hidden>
            <div class="detail-label">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7h14v10H5z"></path><path d="M8 10h8M8 14h5"></path></svg>
              <span>验证码</span>
            </div>
            <button class="verification-code" id="detail-code" type="button" title="点击复制验证码" aria-label="点击复制验证码"></button>
          </div>
          <div class="detail-row">
            <div class="detail-label">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3 2"></path></svg>
              <span>接收时间</span>
            </div>
            <div class="detail-value" id="detail-time"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3h8l3 3v15H7V3Z"></path><path d="M10 10h5v6h-5zM10 7h2"></path></svg>
              <span>SIM 卡</span>
            </div>
            <div class="detail-value" id="detail-sim"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M10 18h4"></path></svg>
              <span>设备</span>
            </div>
            <div class="detail-value" id="detail-device"></div>
          </div>
          <div class="detail-row">
            <div class="detail-label">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"></path></svg>
              <span>应用版本</span>
            </div>
            <div class="detail-value" id="detail-version"></div>
          </div>
        </article>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="assets/app.js?v=1.0.0" defer></script>
</body>
</html>
